pluginManagement {
    // Newer D8 handles the bytecode in current mediation SDKs (AGP 7.4 embeds D8 4.0).
    buildscript {
        repositories {
            google()
            mavenCentral()
            maven { url 'https://storage.googleapis.com/r8-releases/raw' }
        }
        dependencies { classpath 'com.android.tools:r8:8.3.55' }
    }
    repositories {
        **ARTIFACTORYREPOSITORY**
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':launcher', ':unityLibrary'
**INCLUDES**

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        **ARTIFACTORYREPOSITORY**
        google()
        mavenCentral()
// Android Resolver Repos Start
        maven {
            url "https://verve.jfrog.io/artifactory/verve-gradle-release" // Assets/MaxSdk/Mediation/Verve/Editor/Dependencies.xml:7
